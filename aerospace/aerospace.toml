start-at-login = false

# new-window-detection-timeout = 50
# new-window-detection-debounce = 100

accordion-padding = 0
default-root-container-layout = 'tiles'
automatically-unhide-macos-hidden-apps = true
on-focused-monitor-changed = 'move-mouse monitor-lazy-center'

[mode.main.binding]
alt-shift-space = 'fullscreen'
alt-shift-ctrl-z = 'reload-config'

alt-shift-j = 'focus right --boundaries-action wrap-around-the-workspace'
alt-shift-k = 'focus left --boundaries-action wrap-around-the-workspace'

alt-shift-n = 'focus-monitor next --wrap-around'
alt-shift-p = 'focus-monitor prev --wrap-around'

alt-shift-h = 'workspace prev --wrap-around'
alt-shift-l = 'workspace next --wrap-around'
alt-shift-1 = 'workspace main'
alt-shift-2 = 'workspace code'
alt-shift-3 = 'workspace bwsr'

alt-shift-ctrl-1 = 'move-node-to-workspace main'
alt-shift-ctrl-2 = 'move-node-to-workspace code'
alt-shift-ctrl-3 = 'move-node-to-workspace bwsr'

[workspace-to-monitor-force-assignment]
main = '^built-in retina display$'
code = ['^studio display$', '^built-in retina display$']
bwsr = ['^studio display$', '^built-in retina display$']

[gaps]
inner.horizontal = 5
inner.vertical = 5
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0
