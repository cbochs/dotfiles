start-at-login = false

# new-window-detection-timeout = 50
# new-window-detection-debounce = 100

accordion-padding = 0
default-root-container-layout = 'tiles'

[mode.main.binding]
alt-shift-space = 'fullscreen'
alt-shift-ctrl-z = 'reload-config'

alt-shift-j = 'focus right --boundaries-action wrap-around-the-workspace'
alt-shift-k = 'focus left --boundaries-action wrap-around-the-workspace'

alt-shift-n = 'focus-monitor next --wrap-around'
alt-shift-p = 'focus-monitor prev --wrap-around'

alt-shift-h = 'workspace prev --wrap-around'
alt-shift-l = 'workspace next --wrap-around'
alt-shift-1 = 'workspace 1'
alt-shift-2 = 'workspace 2'
alt-shift-3 = 'workspace 3'
alt-shift-4 = 'workspace 4'

alt-1 = 'move-node-to-workspace 1'
alt-2 = 'move-node-to-workspace 2'
alt-3 = 'move-node-to-workspace 3'
alt-4 = 'move-node-to-workspace 4'

# alt-h = 'move-node-to-workspace prev'
# alt-l = 'move-node-to-workspace next'

[workspace-to-monitor-force-assignment]
1 = '^built-in retina display$'
2 = '^built-in retina display$'
# 3 = '^built-in retina display$'
# 4 = '^built-in retina display$'
3 = ['^studio display$', '^built-in retina display$']
4 = ['^studio display$', '^built-in retina display$']

[gaps]
inner.horizontal = 5
inner.vertical = 5
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0
