## Options

# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

# Allow mouse to interact with tmux panes and windows
set -g mouse "on"

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Refresh "status-left" and "status-right" more often, from every 15s to 5s
set -g status-interval 5

# Upgrade $TERM
set -g default-terminal "screen-256color"

# Emacs key bindings in tmux command prompt (prefix + :) are better than
# vi keys, even for vim users
set -g status-keys emacs

# Start windows at one and compact windows when closed
set -g base-index 1
set -g renumber-windows on

# Vi key bindings in tmux copy mode (prefix + [)
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Focus events enabled for terminals that support them
set -g focus-events on

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

## Key Bindings

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"

# Easier and faster switching between next/prev window
bind C-p previous-window
bind C-n next-window
bind C-b last-window

bind C-- split-window -v -c "#{pane_current_path}"
bind C-\\ split-window -h -c "#{pane_current_path}"

# Source .tmux.conf as suggested in `man tmux`
bind r source-file ~/.config/tmux/tmux.conf

## Styles
#
# Syntax
# #S - session
# #T - window pane title
# #I - window index
# #W - window title

%hidden sumiInk1="#181820"
%hidden sumiInk2="#1A2A22"
%hidden sumiInk3="#1F1F28"
%hidden oldWhite="#C8C093"

%hidden autumnGreen="#76946A"

%hidden fujiWhite="#DCD7BA"

set -g pane-active-border-style "fg=$sumiInk2,bg=$sumiInk1"
set -g pane-border-style "fg=$sumiInk1,bg=$sumiInk1"

set -g window-active-style "fg=$fujiWhite,bg=$sumiInk3"
set -g window-style "fg=$oldWhite,bg=$sumiInk1"

set -g window-status-current-format "#[fg=$fujiWhite,bg=$autumnGreen] #I #W #[bg=default,fg=default]"
set -g window-status-format " #I #W "

set -g status-position top
set -g status-justify  left
set -g status-style    "fg=$fujiWhite,bg=$sumiInk1"
set -g status-left     " ❐ [#S] | "
set -g status-right    "#[fg=$autumnGreen,bg=$sumiInk1] #(git -C #{pane_current_path} rev-parse --abbrev-ref HEAD 2>/dev/null) #[bg-default,fg=default]"
