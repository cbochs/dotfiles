---
# Markdownlint configuration for devenv-base projects
# Used by pre-commit hooks and IDE integrations
default: true

# MD007: Unordered list indentation
# Use 2-space indentation to match common markdown conventions
MD007:
  indent: 2

# MD013: Line length
# Allow longer lines (200 chars) for readability
# Different limits for different contexts
MD013:
  line_length: 200
  heading_line_length: 200
  code_blocks: false
  tables: false
  stern: false
# MD046: Code block style
# Allow mixed styles (indented admonitions + fenced codeblocks)
MD046: false
